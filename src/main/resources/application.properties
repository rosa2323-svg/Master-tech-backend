spring.application.name=MasterTech

# Supabase / PostgreSQL mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Pool
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (JWT_SECRET: mínimo 32 caracteres; NO se versiona)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Frontend React (CORS y redirecciones de Stripe)
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:${app.frontend.url}}

# Stripe (modo test)
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.publishable.key=${STRIPE_PUBLISHABLE_KEY}
# Servidor
server.port=${PORT:8089}

# Subida de archivos (imágenes de productos)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Supabase Storage (la service_role key SOLO en variable de entorno)
supabase.url=${SUPABASE_URL}
supabase.service-key=${SUPABASE_SERVICE_KEY}
supabase.bucket.productos=${SUPABASE_BUCKET_PRODUCTOS:Productos}
